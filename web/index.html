<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=farmhouse-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>QQ农场智能助手</title>
    <script>
      // 首屏前应用主题，避免先白后黑的闪烁；与 stores/app.ts 使用同一个 theme_mode。
      (function () {
        try {
          var raw = localStorage.getItem('theme_mode') || 'system'
          var mode = raw.replace(/"/g, '')
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          // 首屏先用缓存品牌色，避免深色/浅色之间的绿闪；完整调色板由 app store 补齐。
          var brand = (localStorage.getItem('brand_color') || '#2f6f9f').replace(/"/g, '')
          if (/^#[0-9a-fA-F]{6}$/.test(brand)) {
            var r = parseInt(brand.slice(1, 3), 16)
            var g = parseInt(brand.slice(3, 5), 16)
            var b = parseInt(brand.slice(5, 7), 16)
            var root = document.documentElement.style
            root.setProperty('--ui-primary', brand)
            root.setProperty('--theme-primary', brand)
            root.setProperty('--ui-primary-rgb', r + ', ' + g + ', ' + b)
            root.setProperty('--theme-primary-rgb', r + ', ' + g + ', ' + b)
          }
        } catch (e) {}
      })()
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
